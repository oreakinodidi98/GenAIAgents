requiredVersions:
    extensions:
      azure.ai.agents: '>=0.1.0-preview'
name: ai-foundry-starter-basic
services:
    agent-framework-agent-basic-responses:
        project: agents/hostedagents
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: 1
                    memory: 2Gi
            deployments:
                - model:
                    name: gpt-4.1-mini
                    version: "2025-04-14"
                    format: OpenAI
                  name: gpt-4.1-mini
                  sku:
                    capacity: 10
                    name: Standard
            startupCommand: python hostedagent.py
infra:
    provider: bicep
    path: ./infra
  